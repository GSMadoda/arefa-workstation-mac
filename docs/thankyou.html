<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application received — LEEMA Technology Incubation</title>
<style>
  :root{--blue:#1668ff;--blue-600:#0f56e0}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(130% 120% at 82% 8%,#13233f,#080b14 55%);
    color:#fff;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:32px;-webkit-font-smoothing:antialiased}
  main{max-width:560px;text-align:center}
  .kick{font:600 12px/1 'Helvetica Neue',Helvetica,sans-serif;letter-spacing:.18em;color:rgba(255,255,255,.6);text-transform:uppercase}
  h1{font:700 clamp(34px,5vw,58px)/1.05 'Helvetica Neue',Helvetica,sans-serif;letter-spacing:-.03em;margin:16px 0 0}
  h1 .accent{color:var(--blue)}
  p{font:400 clamp(16px,1.5vw,19px)/1.6 'Helvetica Neue',Helvetica,sans-serif;color:rgba(255,255,255,.75);margin:22px auto 0;max-width:30em}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;text-decoration:none;
    font:600 15px/1 'Helvetica Neue',Helvetica,sans-serif;padding:15px 26px;border-radius:12px;margin-top:34px}
  .btn:hover{background:var(--blue-600)}
  .rule{display:block;width:84px;height:4px;background:var(--blue);border-radius:2px;margin:26px auto 0}
  .pw{margin-top:40px;font:400 11px/1.4 'Helvetica Neue',Helvetica,sans-serif;color:rgba(255,255,255,.5)}
  .pw b{color:#fff;font-weight:800;letter-spacing:-.01em}
  .pw b span{color:#f5a623}
</style></head>
<body>
<main>
  <div class="kick">LEEMA Technology Incubation</div>
  <h1>Application <span class="accent">received</span>.</h1>
  <span class="rule"></span>
  <p>Thank you. Every applicant gets a written answer — we aim to come back to you within four weeks.</p>
  <a class="btn" href="./">Back to the site &rarr;</a>
  <div class="pw">Powered by <b>AREFA</b></div>
</main>
</body></html>
